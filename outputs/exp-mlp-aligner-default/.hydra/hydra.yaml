hydra:
  run:
    dir: ${output_dir}/${logger.run_name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - logger.run_name=exp-mlp-aligner-default
    - training.num_epochs=1
    - +dataset.train.limit=10000
    - training.eval_steps=50000
    - training.eval_steps_max_batches=500
    - llm.model_loading.device_map=cuda:0
    - dataset.generate.limit=50
    - logger=cometml_jsonl
    - logger.workspace=serega-pirat
  job:
    name: train
    chdir: true
    override_dirname: +dataset.train.limit=10000,dataset.generate.limit=50,llm.model_loading.device_map=cuda:0,logger.run_name=exp-mlp-aligner-default,logger.workspace=serega-pirat,logger=cometml_jsonl,training.eval_steps=50000,training.eval_steps_max_batches=500,training.num_epochs=1
    id: ???
    num: ???
    config_name: layer_skip
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/levanovval/junk/SkipLayer
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/levanovval/junk/SkipLayer/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/levanovval/junk/SkipLayer/outputs/exp-mlp-aligner-default
    choices:
      scheduler: linear_warmup
      optimizer: adamw
      metrics: layer_skip
      collator: default
      dataloader: default
      dataset: default
      logger: cometml_jsonl
      loss: ce
      kv_cache_strategy: default
      iterating_strategy: layer_skip
      layer_skipper: uniform_layer_skipper
      aligner: mlp
      llm: qwen3
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
