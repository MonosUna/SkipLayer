llm:
  _target_: src.models.llms.qwen3.CustomQwen3ForCausalLM
  model_loading:
    pretrained_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
    trust_remote_code: true
    dtype: torch.bfloat16
    device_map: cuda:0
aligner:
  _target_: src.models.aligners.mlp_aligner.MLPAligner
  hidden_size: ${model.hidden_size}
layer_skipper:
  _target_: src.models.layer_skippers.uniform_layer_skipper.UniformLayerSkipper
  num_layers: ${model.num_hidden_layers}
  p: 0.5
  skip_percentile_ranges:
  - - 0.5
    - 1.0
iterating_strategy:
  _target_: src.models.iterating_strategies.layer_skip.LayerSkipIterationStrategy
  kv_cache_strategy: ${kv_cache_strategy}
kv_cache_strategy:
  _target_: src.models.kv_cache_strategies.simple_propagate.SimpleKVCachePropagate
loss:
  _target_: src.losses.ce_loss.CELoss
logger:
  _target_: src.loggers.jsonl_logger.MultiLogger
  workspace: serega-pirat
  run_name: exp14a-mlp-aligner-p0.5-half-
  loggers:
  - _target_: src.loggers.logger.CometMLLogger
    api_key: ${oc.env:COMET_API_KEY}
    project_name: skiplayer-diploma
    workspace: ${logger.workspace}
    run_name: ${logger.run_name}
    auto_metric_logging: false
    auto_param_logging: false
  - _target_: src.loggers.jsonl_logger.JsonlFileLogger
    log_dir: null
    run_name: ${logger.run_name}
dataset:
  train:
    _target_: src.datasets.alpaca_dataset.AlpacaDataset
    dataset_name: tatsu-lab/alpaca
    split: train
    limit: 10000
  test:
    _target_: src.datasets.wikitext_dataset.WikitextDataset
    dataset_name: Salesforce/wikitext
    config_name: wikitext-2-raw-v1
    split: test
  generate:
    _target_: src.datasets.trivia_qa_dataset.TriviaQADataset
    dataset_name: mandarjoshi/trivia_qa
    config_name: rc
    split: test
    limit: 50
dataloader:
  train:
    _target_: torch.utils.data.DataLoader
    _partial_: true
    batch_size: ${training.batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    drop_last: true
  test:
    _target_: torch.utils.data.DataLoader
    _partial_: true
    batch_size: ${training.batch_size}
    shuffle: false
    num_workers: 4
    pin_memory: true
    drop_last: false
  generate:
    _target_: torch.utils.data.DataLoader
    _partial_: true
    batch_size: 1
    shuffle: false
    num_workers: 0
    pin_memory: true
    drop_last: false
collator:
  _base:
    _target_: src.collators.base_collator.BaseCollator
    max_length: 256
    truncation: true
    padding: max_length
    return_tensors: pt
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${llm.model_loading.pretrained_model_name_or_path}
  train:
    _target_: src.collators.base_collator.BaseCollator
    max_length: 256
    truncation: true
    padding: max_length
    return_tensors: pt
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${llm.model_loading.pretrained_model_name_or_path}
  test:
    _target_: src.collators.base_collator.BaseCollator
    max_length: 256
    truncation: true
    padding: max_length
    return_tensors: pt
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${llm.model_loading.pretrained_model_name_or_path}
  generate:
    _target_: src.collators.generation_collator.GenerationCollator
metrics:
  train:
  - _target_: src.metrics.loss.Loss
    loss_fn: ${loss}
  test:
  - _target_: src.metrics.loss.Loss
    loss_fn: ${loss}
  generate:
  - _target_: src.metrics.skip_metrics.SkipMetrics
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${llm.model_loading.pretrained_model_name_or_path}
    max_new_tokens: 64
  - _target_: src.metrics.generations.Generations
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${llm.model_loading.pretrained_model_name_or_path}
    max_new_tokens: 256
    do_sample: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 0.1
  end_factor: 1.0
  total_iters: ${training.warmup_steps}
training_mode: true
training:
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 1
  warmup_steps: 100
  max_grad_norm: 1.0
  mixed_precision: true
  mixed_precision_dtype: torch.bfloat16
  checkpoint_save_epochs: 1
  eval_steps: 50000
  eval_steps_max_batches: 500
  loss_logging_steps: 10
  loss_logging_window: 50
  seed: 42
output_dir: ./outputs
checkpoint_dir: ./checkpoints
checkpoint_weights_only: true
init_checkpoint_path: null
log_checkpoint: false
huggingface:
  repo_id: null
  token: ${oc.env:HF_TOKEN,""}
  private: false
device: cuda
